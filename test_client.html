<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FaceSwap + Voice Clone - Test Client</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #111; color: #eee; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
  .container { max-width: 900px; width: 100%; padding: 20px; }
  h1 { text-align: center; margin-bottom: 20px; font-size: 1.5rem; color: #0af; }
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .panel { background: #1a1a2e; border-radius: 12px; padding: 12px; }
  .panel h3 { font-size: 0.85rem; color: #888; margin-bottom: 8px; }
  video, canvas { width: 100%; border-radius: 8px; background: #000; }
  .controls { text-align: center; margin-bottom: 20px; }
  .btn { padding: 12px 32px; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: 0.2s; }
  .btn-start { background: #0af; color: #000; font-weight: bold; }
  .btn-start:hover { background: #3cf; }
  .btn-stop { background: #f44; color: #fff; }
  .btn-stop:hover { background: #f66; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { text-align: center; color: #888; font-size: 0.85rem; margin-top: 8px; }
  .timer { font-size: 2rem; font-weight: bold; text-align: center; color: #0af; margin: 10px 0; }
  .setup { background: #1a1a2e; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .setup label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 4px; }
  .setup input[type="file"] { width: 100%; padding: 8px; background: #222; border: 1px solid #333; border-radius: 6px; color: #eee; margin-bottom: 12px; }
  .setup input[type="text"] { width: 100%; padding: 8px; background: #222; border: 1px solid #333; border-radius: 6px; color: #eee; margin-bottom: 12px; }
  .fps { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.7); color: #0f0; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-family: monospace; }
  .video-wrap { position: relative; }
  .log { background: #0a0a0a; border-radius: 8px; padding: 12px; max-height: 120px; overflow-y: auto; font-family: monospace; font-size: 0.75rem; color: #0f0; margin-top: 12px; }
</style>
</head>
<body>
<div class="container">
  <h1>⚡ FaceSwap + Voice Clone</h1>

  <div class="setup">
    <label>Server URL</label>
    <input type="text" id="serverUrl" value="ws://localhost:8765" placeholder="ws://server:8765">

    <label>Source Face Image</label>
    <input type="file" id="faceInput" accept="image/*">

    <label>Reference Voice Audio (for cloning)</label>
    <input type="file" id="audioInput" accept="audio/*">
  </div>

  <div class="controls">
    <button class="btn btn-start" id="btnStart" onclick="startCall()">▶ Start Call</button>
    <button class="btn btn-stop" id="btnStop" onclick="stopCall()" disabled>■ Stop</button>
  </div>

  <div class="timer" id="timer">--</div>

  <div class="panels">
    <div class="panel">
      <h3>🎥 Original</h3>
      <div class="video-wrap">
        <video id="localVideo" autoplay muted playsinline></video>
      </div>
    </div>
    <div class="panel">
      <h3>🎭 Processed</h3>
      <div class="video-wrap">
        <canvas id="outputCanvas"></canvas>
        <div class="fps" id="fpsDisplay">0 FPS</div>
      </div>
    </div>
  </div>

  <div class="status" id="status">Load a face image and audio to start</div>
  <div class="log" id="log"></div>
</div>

<script>
let ws = null;
let localStream = null;
let mediaRecorder = null;
let audioCtx = null;
let callActive = false;
let startTime = null;
let timerInterval = null;
let frameInterval = null;
let fpsCount = 0;
let fpsTime = 0;
let outputCtx = null;
let outputCanvas = null;
let sendQueue = [];

const log = (msg) => {
  const el = document.getElementById('log');
  el.innerHTML += `> ${msg}\n`;
  el.scrollTop = el.scrollHeight;
};

async function loadImageAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function loadAudioAsBase64(file) {
  return new Promise((resolve, reject) => {
    // Read as WAV blob
    const reader = new FileReader();
    reader.onload = () => {
      // Convert to PCM if needed
      resolve(reader.result.split(',')[1]);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function startCall() {
  const serverUrl = document.getElementById('serverUrl').value.trim();
  const faceFile = document.getElementById('faceInput').files[0];
  const audioFile = document.getElementById('audioInput').files[0];

  if (!faceFile) {
    log('❌ Please select a source face image');
    return;
  }
  if (!audioFile) {
    log('⚠️ No audio selected - voice cloning disabled');
  }

  document.getElementById('btnStart').disabled = true;
  setStatus('Connecting...');
  log(`Connecting to ${serverUrl}...`);

  try {
    ws = new WebSocket(serverUrl);
  } catch (e) {
    log(`❌ Connection failed: ${e.message}`);
    document.getElementById('btnStart').disabled = false;
    return;
  }

  ws.binaryType = 'arraybuffer';

  ws.onopen = async () => {
    log('✅ Connected');
    setStatus('Loading models...');

    // Load source face
    const faceB64 = await loadImageAsBase64(faceFile);
    let audioB64 = null;
    if (audioFile) {
      audioB64 = await loadAudioAsBase64(audioFile);
    }

    // Send setup
    const setupMsg = {
      source_face: faceB64,
      reference_audio: audioB64,
      enable_voice: audioB64 !== null
    };
    ws.send(JSON.stringify(setupMsg));
    log('📤 Sent setup data');
  };

  ws.onmessage = async (event) => {
    if (typeof event.data === 'string') {
      const msg = JSON.parse(event.data);

      if (msg.status === 'face_loaded') {
        log('✅ Face loaded');
        setStatus('Training voice model...');
      } else if (msg.status === 'voice_ready') {
        log('✅ Voice model ready');
      } else if (msg.status === 'voice_failed') {
        log(`⚠️ Voice failed: ${msg.error}`);
      } else if (msg.status === 'voice_skipped') {
        log('ℹ️ Voice skipped');
      } else if (msg.status === 'ready') {
        log('✅ Ready! Starting stream...');
        setStatus('Call active');
        startTime = Date.now();
        callActive = true;
        document.getElementById('btnStop').disabled = false;
        startTimer(msg.duration || 65);
        startLocalStream();
        startFrameCapture();
      } else if (msg.status === 'error') {
        log(`❌ Error: ${msg.error}`);
        setStatus(`Error: ${msg.error}`);
        stopCall();
      } else if (msg.error) {
        log(`❌ Error: ${msg.error}`);
        setStatus(`Error: ${msg.error}`);
        stopCall();
      }
    } else if (event.data instanceof ArrayBuffer) {
      // Processed frame or audio from server
      const buf = new Uint8Array(event.data);
      const msgType = buf[0];
      // const timestamp = new DataView(buf.buffer, 1, 4).getUint32(0);
      const payload = buf.slice(5);

      if (msgType === 0) {
        // Video frame
        renderFrame(payload);
        fpsCount++;
      } else if (msgType === 1) {
        // Audio chunk - play through audio
        playAudio(payload);
      }
    }
  };

  ws.onclose = () => {
    log('🔌 Disconnected');
    stopCall();
  };

  ws.onerror = (e) => {
    log(`❌ WebSocket error`);
    stopCall();
  };
}

function startLocalStream() {
  navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, frameRate: 20 }, audio: { channelCount: 1, sampleRate: 16000 } })
    .then(stream => {
      localStream = stream;
      document.getElementById('localVideo').srcObject = stream;
      log('📷 Camera started');
    })
    .catch(e => {
      log(`❌ Camera error: ${e.message}`);
    });
}

function startFrameCapture() {
  if (!outputCanvas) {
    outputCanvas = document.getElementById('outputCanvas');
    outputCtx = outputCanvas.getContext('2d');
  }

  let captureVideo = document.createElement('video');
  captureVideo.autoplay = true;
  captureVideo.muted = true;
  captureVideo.playsinline = true;

  // Use local video as source
  const src = document.getElementById('localVideo');
  if (!src.srcObject) return;

  let lastCapture = 0;
  const FPS = 15; // Send 15 fps

  frameInterval = setInterval(() => {
    if (!callActive || !ws || ws.readyState !== WebSocket.OPEN) {
      clearInterval(frameInterval);
      return;
    }

    const src = document.getElementById('localVideo');
    if (!src.videoWidth) return;

    // Draw frame to canvas for JPEG encoding
    outputCanvas.width = src.videoWidth;
    outputCanvas.height = src.videoHeight;
    outputCtx.drawImage(src, 0, 0);

    outputCanvas.toBlob((blob) => {
      if (!blob || !callActive) return;
      const reader = new FileReader();
      reader.onload = () => {
        const buf = reader.result;
        const header = new ArrayBuffer(5);
        const view = new DataView(header);
        view.setUint8(0, 0); // type: video frame
        view.setUint32(1, Date.now() - startTime); // timestamp
        ws.send(new Blob([header, buf]));
      };
      reader.readAsArrayBuffer(blob);
    }, 'image/jpeg', 70);

    // Update FPS
    const now = Date.now();
    if (now - fpsTime > 1000) {
      document.getElementById('fpsDisplay').textContent = `${fpsCount} FPS`;
      fpsCount = 0;
      fpsTime = now;
    }
  }, 1000 / FPS);
}

function renderFrame(data) {
  const blob = new Blob([data], { type: 'image/jpeg' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    outputCanvas.width = img.width;
    outputCanvas.height = img.height;
    outputCtx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
  };
  img.src = url;
}

function playAudio(data) {
  // For now, we need an AudioContext + worklet for real playback
  // Simple approach: buffer and play through oscillator would work
  // but browser audio worklets are complex for raw PCM.
  // Skipping for now - will add proper audio playback later.
}

function startTimer(duration) {
  document.getElementById('timer').textContent = '60';
  timerInterval = setInterval(() => {
    const elapsed = (Date.now() - startTime) / 1000;
    const remaining = Math.max(0, duration - elapsed);
    document.getElementById('timer').textContent = Math.ceil(remaining);
    if (remaining <= 0) {
      stopCall();
    }
  }, 200);
}

function stopCall() {
  callActive = false;
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnStop').disabled = true;
  document.getElementById('timer').textContent = '--';

  if (timerInterval) clearInterval(timerInterval);
  if (frameInterval) clearInterval(frameInterval);

  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  document.getElementById('localVideo').srcObject = null;

  if (ws) {
    if (ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ action: 'end_call' }));
    }
    ws.close();
    ws = null;
  }

  setStatus('Call ended');
  log('⏹️ Call stopped');
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}
</script>
</body>
</html>
